apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-llm-agent
  labels:
    app: planner-llm-agent
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: planner-llm-agent
  template:
    metadata:
      labels:
        app: planner-llm-agent
    spec:
      # Aligned with the agent graceful shutdown (SIGTERM to the CLI process
      # groups, then SIGKILL after SHUTDOWN_KILL_GRACE_MS = 10s): the extra
      # head-room also covers the agent exit and the pod cleanup.
      terminationGracePeriodSeconds: 30
      securityContext:
        # The image runs as the non-root user agent (uid/gid 10001); fsGroup
        # gives that group the write access to the mounted /data volume.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - image: planner-llm-agent
          name: planner-llm-agent
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Liveness/readiness on the heartbeat file the agent refreshes
          # every 15 seconds (agent/src/Heartbeat.ts): an exec probe fails
          # when the file is older than its freshness threshold, so a hung
          # event loop marks the pod not ready (readiness) then restarts it
          # (liveness). The root filesystem is not read-only on purpose: the
          # coding-agent CLIs write caches and configuration under their
          # HOME on the container filesystem.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /data/agent-heartbeat 2>/dev/null || echo 0) )) -lt 120
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /data/agent-heartbeat 2>/dev/null || echo 0) )) -lt 40
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 5
          env:
            - name: AGENT_NAME
              value: "planner-llm-agent"
            - name: PLANNER_URL
              value: "http://planner:8080"
            # Parallel scheduling (see the "Parallel scheduling" section of
            # the README): weighted capacity budget, conflict mode and the
            # optional utility model pre-evaluating hint-less tasks. The
            # defaults below are the built-in ones.
            # - name: TASK_MAX_PARALLEL
            #   value: "1.9"
            # - name: TASK_SMART_SCHEDULING
            #   value: "true"
            # - name: TASK_CONFLICT_MODE
            #   value: "repo"
            # - name: AGENT_UTILITY_MODEL
            #   value: "DeepSeek-Flash"
            - name: PLANNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: PLANNER_API_KEY
            - name: QODER_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: QODER_PERSONAL_ACCESS_TOKEN
                  optional: true
            # Credentials of the other supported coding-agent CLIs
            # (AGENT_CLI: claude-code, copilot-cli, codex, gemini-cli).
            # Copilot CLI reuses the GitHub token below.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: GEMINI_API_KEY
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: GITHUB_TOKEN
          # The Qoder CLI runs as a child process of the agent and needs a
          # large Node.js heap (it OOMs with the default heap sized from a
          # 500Mi cgroup limit). Every running task is one CLI process and
          # the scheduler runs at most ceil(TASK_MAX_PARALLEL) of them at a
          # time: size the limit for the agent plus those CLI processes.
          resources:
            limits:
              memory: 2Gi
              cpu: "1"
            requests:
              memory: 100Mi
              cpu: 100m
          volumeMounts:
            - mountPath: /data
              name: pod-volume
            # Mounted as a directory (no subPath): Kubernetes only
            # propagates ConfigMap updates to directory-mounted volumes, so
            # the agent can hot-reload the actions file without a restart.
            - name: config-volume
              mountPath: /etc/planner
      volumes:
        - name: pod-volume
          persistentVolumeClaim:
            claimName: planner-llm-agent
        - name: config-volume
          configMap:
            name: planner-llm-agent-config
