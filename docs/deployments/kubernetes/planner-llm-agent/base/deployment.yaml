apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-llm-agent
  labels:
    app: planner-llm-agent
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: planner-llm-agent
  template:
    metadata:
      labels:
        app: planner-llm-agent
    spec:
      # The image runs as the dedicated non-root user (uid/gid 10001, see the
      # Dockerfile). fsGroup hands ownership of the mounted /data volume to
      # that group so the agent can write to it; the volume must also be
      # writable by uid 10001 when the new image rolls out (prerequisite
      # coordinated in the GitOps repository).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # The agent traps SIGTERM and terminates the CLI process groups of the
      # running tasks (SIGTERM, ~10s grace, then exit): 30s is enough for a
      # clean stop without delaying a rollout noticeably.
      terminationGracePeriodSeconds: 30
      containers:
        - image: planner-llm-agent
          name: planner-llm-agent
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # readOnlyRootFilesystem is deliberately not set: the coding-agent
            # CLIs and the Git tooling write caches, configuration and clones
            # under $HOME and /tmp at runtime.
          # Health is tracked through the heartbeat file the agent refreshes
          # every 30 seconds under /data (written early at startup, then by
          # the polling loop). The startup probe only waits for the first
          # heartbeat; readiness tolerates 120s of staleness, liveness 300s.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test -f /data/heartbeat'
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test $(( $(date +%s) - $(stat -c %Y /data/heartbeat 2>/dev/null || echo 0) )) -lt 120'
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test $(( $(date +%s) - $(stat -c %Y /data/heartbeat 2>/dev/null || echo 0) )) -lt 300'
            periodSeconds: 30
            failureThreshold: 10
          env:
            - name: AGENT_NAME
              value: "planner-llm-agent"
            - name: PLANNER_URL
              value: "http://planner:8080"
            # Parallel scheduling (see the "Parallel scheduling" section of
            # the README): weighted capacity budget, conflict mode and the
            # optional utility model pre-evaluating hint-less tasks. The
            # defaults below are the built-in ones.
            # - name: TASK_MAX_PARALLEL
            #   value: "1.9"
            # - name: TASK_SMART_SCHEDULING
            #   value: "true"
            # - name: TASK_CONFLICT_MODE
            #   value: "repo"
            # - name: AGENT_UTILITY_MODEL
            #   value: "DeepSeek-Flash"
            - name: PLANNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: PLANNER_API_KEY
            - name: QODER_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: QODER_PERSONAL_ACCESS_TOKEN
                  optional: true
            # Credentials of the other supported coding-agent CLIs
            # (AGENT_CLI: claude-code, copilot-cli, codex, gemini-cli).
            # Copilot CLI reuses the GitHub token below.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: GEMINI_API_KEY
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-llm-agent
                  key: GITHUB_TOKEN
          # The Qoder CLI runs as a child process of the agent and needs a
          # large Node.js heap (it OOMs with the default heap sized from a
          # 500Mi cgroup limit). Every running task is one CLI process and
          # the scheduler runs at most ceil(TASK_MAX_PARALLEL) of them at a
          # time: size the limit for the agent plus those CLI processes.
          resources:
            limits:
              memory: 2Gi
              cpu: "1"
            requests:
              memory: 100Mi
              cpu: 100m
          volumeMounts:
            - mountPath: /data
              name: pod-volume
            # Mounted as a directory (no subPath): Kubernetes only
            # propagates ConfigMap updates to directory-mounted volumes, so
            # the agent can hot-reload the actions file without a restart.
            - name: config-volume
              mountPath: /etc/planner
      volumes:
        - name: pod-volume
          persistentVolumeClaim:
            claimName: planner-llm-agent
        - name: config-volume
          configMap:
            name: planner-llm-agent-config
