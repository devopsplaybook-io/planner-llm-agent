apiVersion: v1
kind: ConfigMap
metadata:
  name: planner-llm-agent-config
data:
  # Agent actions configuration: the agent watches this file and applies a
  # change without a restart (the volume is mounted as a directory so
  # Kubernetes propagates the ConfigMap updates).
  llm-agent.yaml: |
    default:
      model: auto
      # Global task timeout in seconds, applied to the actions without their
      # own timeout (defaults to 3600 = 1 hour when unset).
      # timeout: 3600
    actions:
      - project: Web
        status_start: To Do
        status_end: In Review
        model: DeepSeek-Flash
        instruction: Follow the repository coding guidelines and open a PR when the task is done.
        # Per-action task timeout in seconds (optional).
        # timeout: 1800
        # Scheduling weight of the tasks handled by this action: a number
        # greater than 0 and at most 1 (optional, default 1; see the
        # "Parallel scheduling" section of the README).
        # weight: 0.5
      - project: Backend
        status_start: To Do
        status_end: Done
      # 'project' supports '*' wildcards (any sequence of characters,
      # case-sensitive full match):
      # - project: Project*
      #   status_start: Blocked
      #   status_end: Done
      # 'project' is optional: a missing, null or empty 'project' matches
      # any project.
      # - status_start: In Progress
      #   status_end: Done
