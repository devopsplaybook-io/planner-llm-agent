name: Main Build

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  merge-build:
    # Pinned to a commit SHA so the build cannot change under the release.
    # Refresh with: gh api repos/devopsplaybook-io/common-utils/commits/main --jq .sha
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-merge-build.yml@4d4ea0dd4944408f2db109a343035c6f2746f884
    with:
      node_app_directories: '["agent"]'
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      QUALITY_DASHBOARD_URL: ${{ secrets.QUALITY_DASHBOARD_URL }}
      QUALITY_DASHBOARD_TOKEN: ${{ secrets.QUALITY_DASHBOARD_TOKEN }}
