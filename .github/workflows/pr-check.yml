name: PR Check

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-verify:
    # Pinned to a commit SHA so the quality gates cannot change under the build.
    # Refresh with: gh api repos/devopsplaybook-io/common-utils/commits/main --jq .sha
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-pr-verify.yml@fd596fb62a41c71f596e2714b5d35cbda31985d5
    with:
      node_app_directories: '["agent"]'
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      QUALITY_DASHBOARD_URL: ${{ secrets.QUALITY_DASHBOARD_URL }}
      QUALITY_DASHBOARD_TOKEN: ${{ secrets.QUALITY_DASHBOARD_TOKEN }}
