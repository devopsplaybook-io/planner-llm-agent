name: PR Check

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-verify:
    # Temporary pin while the immutable build strategy is validated end-to-end.
    # Revert to @main once devopsplaybook-io/common-utils#16 is merged.
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-pr-verify.yml@feature/2026.09-immutable-docker-build
    with:
      node_app_directories: '["agent"]'
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      QUALITY_DASHBOARD_URL: ${{ secrets.QUALITY_DASHBOARD_URL }}
      QUALITY_DASHBOARD_TOKEN: ${{ secrets.QUALITY_DASHBOARD_TOKEN }}
